services:
  mariadb:
    image: mariadb:latest
    container_name: nextcloud_mariadb
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --log-bin=ROW --skip-innodb-read-only-compressed
    volumes:
      - /etc/containers/nextcloud/mysql-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=P455w0rd!
      - MYSQL_PASSWORD=P455w0rd!
      - MYSQL_DATABASE=nextcloudDB
      - MYSQL_USER=nextcloudUser
    networks:
      - default

  redis:
    image: redis:alpine
    container_name: nextcloud_redis
    hostname: nextcloud_redis
    restart: unless-stopped
    command: redis-server --requirepass P455w0rd!
    networks:
      - default

  nextcloud-app:
    image: nextcloud
    container_name: nextcloud_app
    restart: unless-stopped
    depends_on:
      - mariadb
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_HOST_PASSWORD=P455w0rd!
      - MYSQL_HOST=mariadb
      - MYSQL_USER=nextcloudUser
      - MYSQL_PASSWORD=P455w0rd!
      - MYSQL_DATABASE=nextcloudDB
    volumes:
      - /etc/containers/nextcloud/nextcloud-app:/var/www/html
    networks:
      - default
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.nextcloud.rule=Host(`^nextcloud(\..+.\.local|\.local)$`)
      - traefik.http.routers.nextcloud.entrypoints=web
      - traefik.http.services.nextcloud.loadbalancer.server.port=80
      - traefik.http.services.nextcloud.loadbalancer.passHostHeader=true
networks:
  traefik:
    external: true