services:
  plex:
    image: plexinc/pms-docker
    container_name: plex
    restart: unless-stopped
    ports:
      #- 32400:32400/tcp
      - 3005:3005/tcp
      - 8324:8324/tcp
      - 32469:32469/tcp
      - 1900:1900/udp
      - 32410:32410/udp
      - 32412:32412/udp
      - 32413:32413/udp
      - 32414:32414/udp
    environment:
      - TZ=Europe/Vienna
      - PLEX_CLAIM=claim-KSxPSFtBJMTECCFd6GnR
      - ADVERTISE_IP=http://192.168.1.4:32400/
    hostname: plex.blackbox.lab.p-exe.com
    labels:
      - plex
      - traefik.enable=true
      - traefik.http.routers.plex.rule=Host(`plex.blackbox.lab.p-exe.com`)
      - traefik.http.routers.plex.entrypoints=web
      - traefik.http.services.plex.loadbalancer.server.port=32400
      #- traefik.http.routers.plex.tls.certresolver=myresolver
      - traefik.frontend.rule=Host:traefik.domain
      - traefik.http.routers.plex.middlewares=middlewares-rate-limit@file,middlewares-ipwhilelist@file
    volumes:
      - ./config:/config
      - ./transcode:/transcode
      - ./media:/media